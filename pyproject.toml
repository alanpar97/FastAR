[project]
name = "fastar"
version = "0.1.0"
description = "Reinforcement-learning-based counterfactual recourse for tabular classifiers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.2.3",
    "numpy>=2.4.4",
    "scikit-learn>=1.8.0",
    "stable-baselines3>=2.8.0",
]

[project.optional-dependencies]
examples = [
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pandas>=2.2",
    "pytest>=9.0.3",
    "ruff>=0.15.9",
    "ty>=0.0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastar"]
